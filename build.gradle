plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'
tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
    }
}

dependencies {
    implementation 'org.json:json:20231013'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testCompileOnly 'org.projectlombok:lombok:1.18.32'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.32'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    //implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'


}

application {
    mainClass = 'org.example.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.test {
    useJUnitPlatform()
}

tasks.named('run') {
    args = ['cities.json']
    // Пробрасываем stdin Gradle-задаче run, чтобы Scanner(System.in) был интерактивным
    standardInput = System.in
}

tasks.register('runServer', JavaExec) {
    group = 'application'
    description = 'Run TCP collection server'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.server.ServerMain'
    standardInput = System.in
}

tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Run TCP collection client'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.client.ClientMain'
    // For cleaner interactive console: gradle -q --console=plain runClient --args="localhost 5555"
    standardInput = System.in
}

